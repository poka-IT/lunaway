"""
What the server concluded from the position sent with a confirmation.
"""
enum Presence {
	"""
	Within 300 m of the place.
	"""
	PRESENT
	"""
	No position, or one too far or too vague.
	"""
	UNVERIFIED
}

"""
A position sent with a confirmation, reduced to a verdict and never
stored.
"""
input PresenceInput {
	"""
	Latitude, degrees.
	"""
	lat: Float!
	"""
	Longitude, degrees.
	"""
	lon: Float!
	"""
	The device's horizontal accuracy, metres.
	"""
	accuracyM: Float
}

type Query {
	"""
	Version of the running API.
	"""
	apiVersion: String!
	"""
	The server's policy for the app.
	"""
	config: AppConfig!
	"""
	Every kind of place, in display order.
	"""
	placeKinds: [PlaceKind!]!
	"""
	Every data source, with its licence and attribution.
	"""
	sources: [Source!]!
	"""
	Syncs a region: the places inside `bbox` created or changed since the
	cursor `since` (null for everything), oldest change first, at most
	`first` (1000 at most), and the places deleted since. A cursor issued
	by another copy of the database (after a restore) is refused with the
	code `RESYNC`: sync again with `since: null`.
	"""
	changes(bbox: BBoxInput!, since: String, first: Int = 1000): ChangeSet!
	"""
	The places of a viewport (500 per page at most, viewport area
	bounded), for the web or a device that has not synced yet.
	"""
	places(bbox: BBoxInput!, filter: PlaceFilter, first: Int = 200, after: String): PlaceConnection!
	"""
	One place. A place merged into another answers with the place that
	absorbed it (whose id differs); a deleted place answers null.
	"""
	place(id: UUID!): Place
	"""
	Searches names, address cities and municipalities, without accents:
	whole words first, then word prefixes, then typo-tolerant matches;
	among equal matches, the nearest to `near` first.
	"""
	search(text: String!, near: LatLonInput, first: Int = 20): [Place!]!
	"""
	The signed-in account, with its level and what the next one needs.
	`UNAUTHENTICATED` without a valid session.
	"""
	myAccount: Account!
	"""
	The signed-in account's favourite lists, by name, with their places.
	"""
	myFavoriteLists: [FavoriteList!]!
}

