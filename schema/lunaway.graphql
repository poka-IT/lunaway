	The published reviews with text, newest first (50 per page at most),
	without the authors the caller muted. Read per place.
	"""
	reviews(first: Int = 20, after: String): ReviewConnection!
	"""
	The caller's own rating or review of the place, whatever its status;
	null when anonymous or when there is none.
	"""
	myReview: Review
}

"""
A page of places.
"""
type PlaceConnection {
	"""
	The places, in a stable order.
	"""
	nodes: [Place!]!
	"""
	Pass it as `after` to get the next page; null on an empty page.
	"""
	endCursor: String
	"""
	Whether another page follows.
	"""
	hasNextPage: Boolean!
	"""
	Places matching in the whole viewport.
	"""
	totalCount: Int!
}

"""
What a contributor knows of a place; an absent field says nothing.
"""
input PlaceDetailsInput {
	"""
	Display name, 2 to 120 characters.
	"""
	name: String
	"""
	What the place is.
	"""
	kind: PlaceKind
	"""
	Whether a night may be spent there.
	"""
	overnight: OvernightStatus
	"""
	Services on site (the whole set).
	"""
	services: [Service!]
	"""
	Activities around (the whole set).
	"""
	activities: [Activity!]
	"""
	A description in one language.
	"""
	description: LocalizedTextInput
	"""
	Price of a night, euros (0 is free).
	"""
	priceParkingEur: Float
	"""
	Price of the services, euros.
	"""
	priceServicesEur: Float
	"""
	Maximum vehicle height, metres.
	"""
	maxHeightM: Float
	"""
	Pitches for motorhomes.
	"""
	capacity: Int
	"""
	Opening hours, OSM syntax.
	"""
	openingHours: String
	"""
	Website, http(s).
	"""
	website: String
	"""
	Phone.
	"""
	phone: String
}

"""
Filters of the viewport query; every filter given must hold.
"""
input PlaceFilter {
	"""
	Only these kinds.
	"""
	kinds: [PlaceKind!]
	"""
	The place must have all of them.
	"""
	services: [Service!]
	"""
	`true` keeps only places where a night is allowed or tolerated;
	`false` or absent does not filter.
	"""
	overnightOk: Boolean
	"""
	Leaves out places whose known maximum height is below this, in
	metres; places of unknown height stay.
	"""
	vehicleHeightM: Float
}

"""
What a place is.
"""
enum PlaceKind {
	"""
	A dedicated motorhome area, with or without services.
	"""
	MOTORHOME_AREA
	"""
	Motorhome services without overnight parking.
	"""
	SERVICE_AREA
	"""
	A campsite.
	"""
	CAMPSITE
	"""
	A general car park that takes motorhomes.
	"""
	PARKING
	"""
	A spot in nature, away from any facility.
	"""
	NATURE
	"""
	A roadside rest area.
	"""
	REST_AREA
	"""
	A picnic area.
	"""
	PICNIC_AREA
	"""
	A farm, vineyard or producer that hosts motorhomes.
	"""
	FARM
	"""
	A private host who welcomes travellers on their land.
	"""
	HOMESTAY
	"""
	A spot reachable with a 4x4 only.
	"""
	OFF_ROAD
	"""
	A useful stop that is not a place to stay.
	"""
	EXTRA_SERVICE
}

"""
A source of a place: which record of which source describes it.
"""
type PlaceSource {
	"""
	The source.
	"""
	source: Source!
	"""
	Identifier of the record in the source (`way/123`).
	"""
	externalId: String!
	"""
	Page of the record at the source, when it has one.
	"""
	externalUrl: String
	"""
	When the source was read.
	"""
	fetchedAt: DateTime!
	"""
	How well the record matched the others of the place (0 to 1); null
	when it is the place's only record.
	"""
	matchScore: Float
}

"""
A new place or a place edit, with where it stands.
"""
type PlaceSubmission {
	"""
	Stable identifier.
	"""
	id: UUID!
	"""
	A new place or an edit.
	"""
	kind: SubmissionKind!
	"""
	The place edited, or the place a new one became (null until the
	server placed it).
	"""
	placeId: UUID
	"""
	Where it stands.
	"""
	status: SubmissionStatus!
	"""
	When it was sent.
	"""
	createdAt: DateTime!
	"""
	When it became part of the places database.
	"""
	appliedAt: DateTime
}

"""
A page of the account's submissions, newest first.
"""
type PlaceSubmissionConnection {
	"""
	The submissions.
	"""
	nodes: [PlaceSubmission!]!
	"""
	Pass it as `after` for the next page.
	"""
	endCursor: String
	"""
	Whether another page follows.
	"""
	hasNextPage: Boolean!
	"""
	Submissions in the whole list.
