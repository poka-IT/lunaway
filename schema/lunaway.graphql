	lengthM: Float!
	"""
	Maximum authorised mass, tonnes.
	"""
	weightT: Float!
	"""
	Heaviest axle, tonnes, when known: axle load limits are checked only
	with it.
	"""
	axleLoadT: Float
	"""
	The trailer, when towing.
	"""
	trailer: Trailer
	"""
	The highest speed the driver keeps to, km/h, when they set one (many
	drive a motorhome at 90 to 100 on a motorway open at 130). The
	travel times and the choice of route assume it wherever the road
	allows more; it never lifts the vehicle's legal ceiling, and the
	speed limits of the route stay the road's.
	"""
	cruiseSpeedKph: Int
}

"""
The vehicle, as on its registration document. The bounds refuse typing
errors: a height of 1.5 to 4.5 m, a width of 1.5 to 2.6 m without
mirrors, a length of 3 to 15 m, a maximum authorised mass (field F.2) of
0.5 to 40 t, an axle load of 0.5 to 13 t, a cruising speed of 50 to
130 km/h.
"""
input VehicleProfileInput {
	"""
	What the vehicle is.
	"""
	kind: VehicleType!
	"""
	Overall height, roof equipment included, metres.
	"""
	heightM: Float!
	"""
	Overall width without mirrors, metres.
	"""
	widthM: Float!
	"""
	Overall length, bike rack included, metres.
	"""
	lengthM: Float!
	"""
	Maximum authorised mass, tonnes.
	"""
	weightT: Float!
	"""
	Heaviest axle, tonnes, when known: axle load limits are checked only
	with it.
	"""
	axleLoadT: Float
	"""
	The trailer, when towing.
	"""
	trailer: TrailerInput
	"""
	The highest speed the driver keeps to, km/h, when they set one (many
	drive a motorhome at 90 to 100 on a motorway open at 130). The
	travel times and the choice of route assume it wherever the road
	allows more; it never lifts the vehicle's legal ceiling, and the
	speed limits of the route stay the road's.
	"""
	cruiseSpeedKph: Int
}

"""
What the vehicle is, for its typical dimensions; the route depends on
the dimensions only. (`VehicleKind` is the coarser kind a review names.)
"""
enum VehicleType {
	"""
	A compact campervan on a van base (California class).
	"""
	VAN
	"""
	A panel van conversion ("fourgon aménagé").
	"""
	PANEL_VAN
	"""
	A low-profile motorhome ("profilé").
	"""
	LOW_PROFILE
	"""
	A motorhome with a bed over the cab ("capucine").
	"""
	OVERCAB
	"""
	An integrated (A-class) motorhome ("intégral").
	"""
	INTEGRATED
	"""
	Anything else.
	"""
	OTHER
}

"""
Whether a place can be trusted to exist as described.
"""
enum Verification {
	"""
	Described by an open source, or confirmed by the community.
	"""
	VERIFIED
	"""
	Added by a contributor, not yet confirmed by two others.
	"""
	TO_VERIFY
}

"""
Whether the vehicle may pass.
"""
enum WarningSeverity {
	"""
	It may not: the route avoids the place (a blocker of
	`NO_SAFE_ROUTE`).
	"""
	BLOCKING
	"""
	It may, with care.
	"""
	WARNING
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
