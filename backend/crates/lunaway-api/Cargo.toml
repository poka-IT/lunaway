[package]
name = "lunaway-api"
description = "Lunaway HTTP and GraphQL API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
# Every integration test of the crate links into one binary, each file of
# tests/ a module of tests/main.rs: one link step, one copy of the
# dependencies on disk and one first-launch scan by macOS, instead of one
# per file. A file not declared in tests/main.rs would never run; the
# test every_integration_test_file_is_compiled (lunaway-domain) fails then.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

# Its own binary: infra/routing/e2e.sh selects it by name on the build
# server (`-E 'binary(route_e2e)'`), and every test in it is ignored.
[[test]]
name = "route_e2e"
path = "tests/route_e2e.rs"

[dependencies]
anyhow.workspace = true
async-graphql.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
flate2.workspace = true
http-body-util.workspace = true
lunaway-auth.workspace = true
lunaway-db.workspace = true
lunaway-domain.workspace = true
lunaway-media.workspace = true
reqwest.workspace = true
rustls.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# The raw database of a pack, removed whatever happens to the build.
tempfile.workspace = true

[dev-dependencies]
lunaway-conflate.workspace = true
lunaway-ingest.workspace = true
p256.workspace = true
sqlx.workspace = true
tower.workspace = true

[lints]
workspace = true
