[package]
name = "lunaway-domain"
description = "Lunaway domain types and rules: the taxonomy, normalised records, conflation scoring. Pure, no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
# Every integration test of the crate links into one binary, each file of
# tests/ a module of tests/main.rs: one link step, one copy of the
# dependencies on disk and one first-launch scan by macOS, instead of one
# per file. A file not declared in tests/main.rs would never run; the
# test every_integration_test_file_is_compiled (lunaway-domain) fails then.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
chrono.workspace = true
# The named periods of the road events (night, day) are hours in France.
chrono-tz.workspace = true
country-boundaries.workspace = true
# The cells of a takedown's exclusion zone, and their keyed hashes.
h3o.workspace = true
hmac.workspace = true
serde.workspace = true
# The keyed hash that places a camera inside its danger zone.
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
