[package]
name = "lunaway-db"
description = "Lunaway database access: migrations and sqlx repositories over PostgreSQL + PostGIS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
# Every integration test of the crate links into one binary, each file of
# tests/ a module of tests/main.rs: one link step, one copy of the
# dependencies on disk and one first-launch scan by macOS, instead of one
# per file. A file not declared in tests/main.rs would never run; the
# test every_integration_test_file_is_compiled (lunaway-domain) fails then.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
chrono.workspace = true
futures-util.workspace = true
lunaway-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `test-util` pauses tokio's clock: the worker's settle bound is tested to
# the millisecond whatever the machine's load.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
