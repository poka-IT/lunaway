[package]
name = "lunaway-ingest"
description = "Lunaway ingestion adapters: OpenStreetMap through Overpass, Atout France classified campsites geocoded with the BAN."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
# Every integration test of the crate links into one binary, each file of
# tests/ a module of tests/main.rs: one link step, one copy of the
# dependencies on disk and one first-launch scan by macOS, instead of one
# per file. A file not declared in tests/main.rs would never run; the
# test every_integration_test_file_is_compiled (lunaway-domain) fails then.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
backon.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
csv.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
lunaway-db.workspace = true
lunaway-domain.workspace = true
lunaway-media.workspace = true
osmpbf.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
sqlx.workspace = true
axum.workspace = true
proptest.workspace = true
tempfile.workspace = true
lunaway-conflate.workspace = true

[lints]
workspace = true
