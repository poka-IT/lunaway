# cargo-deny policy: the dependency tree stays auditable, maintained and
# compatible with the AGPL. Add an entry only after reviewing what needs it,
# with the reason next to it.

[advisories]
version = 2
yanked = "deny"
# Every ignore carries its reachability argument, and the same id goes into
# .cargo/audit.toml.
ignore = []

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are referenced by path without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
