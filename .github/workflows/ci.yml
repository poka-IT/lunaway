# The same gates as tool/check.sh, split in parallel jobs so a red one says
# where to look and the slowest one sets the wait. Every job has a timeout: a job past it is an infrastructure
# problem to investigate, never a slow build to wait for.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: wiring, dashes, lockfiles
        run: |
          sh tool/harness/git/check_harness.sh
          sh tool/harness/git/check_dashes.sh --all
          sh tool/harness/git/check_lock.sh HEAD
      - name: secrets in the pushed range
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          sh tool/harness/git/check_secrets.sh "$base" HEAD
      - name: commit messages in the pushed range
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          mkdir -p data/tmp
          for c in $(git rev-list "$base..HEAD"); do
            git log -1 --format=%B "$c" > data/tmp/ci-commit-msg.txt
            sh .githooks/commit-msg data/tmp/ci-commit-msg.txt || { echo "commit $c"; exit 1; }
          done
      - name: hook tests
        run: |
          python3 tool/harness/hooks/tests/test_guards.py
          python3 tool/harness/hooks/tests/test_agent_liveness.py
          python3 tool/harness/hooks/tests/test_commit_msg.py
      - name: web server tests
        run: python3 app/tool/web/test_serve_csp.py
      - name: unit restart tests
        run: python3 infra/tests/unit-restart.py
      - name: workflow lint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # The app's gates run as three parallel jobs: code generation, analysis and
  # tests each take about a minute, and in one job they ran one after the
  # other (about four minutes before the first red result).
  app-generated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: pinned Flutter version
        run: |
          echo "FLUTTER_VERSION=$(sed -n 's/.*"flutter": "\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: packages
        working-directory: app
        run: flutter pub get
      - name: format (generated files stay as their generator wrote them)
        run: |
          find app/lib app/test app/integration_test tool -name '*.dart' ! -name '*.g.dart' ! -name '*.freezed.dart' -print0 2>/dev/null \
            | xargs -0 dart format --output=none --set-exit-if-changed
      - name: translations and structure
        run: |
          dart tool/i18n_check.dart
          dart tool/structure_check.dart
      - name: generated code is committed and fresh
        working-directory: app
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib || { echo "::error::generated code is stale: run slang and build_runner, commit the output"; exit 1; }

  app-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: pinned Flutter version
        run: |
          echo "FLUTTER_VERSION=$(sed -n 's/.*"flutter": "\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: packages
        working-directory: app
        run: flutter pub get
      - name: analyze (dart analyze loads riverpod_lint, flutter analyze does not)
        working-directory: app
        run: dart analyze --fatal-infos

  app-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: pinned Flutter version
        run: |
          echo "FLUTTER_VERSION=$(sed -n 's/.*"flutter": "\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: packages
        working-directory: app
        run: flutter pub get
      # The guidance engine is a Rust crate the Flutter build hook compiles
      # for the host before the tests load it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/packages/lunaway_nav/rust
          key: ${{ hashFiles('app/packages/lunaway_nav/rust/Cargo.toml') }}
      - name: guidance engine for the host
        working-directory: app/packages/lunaway_nav/rust
        run: cargo build --locked --release
      - name: tests
        working-directory: app
        run: flutter test --no-pub

  goldens:
    # The golden images are made on macOS (the maintainer's machine): text
    # rasterises differently elsewhere, so they are compared on macOS too,
    # with the small tolerance of app/test/flutter_test_config.dart.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: pinned Flutter version
        run: |
          echo "FLUTTER_VERSION=$(sed -n 's/.*"flutter": "\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: packages
        working-directory: app
        run: flutter pub get
      - name: golden images
        working-directory: app
        run: flutter test --no-pub --tags golden test/goldens
      - name: differences, for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/goldens/failures/

  windows:
    # Builds the Windows app (release), so the target cannot rot between
    # the releases that ship it. Nothing runs it here.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: pinned Flutter version
        shell: bash
        run: |
          echo "FLUTTER_VERSION=$(sed -n 's/.*"flutter": "\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: packages
        working-directory: app
        run: flutter pub get
      - name: build
        working-directory: app
        run: flutter build windows --release --no-pub

  ios:
    # Builds the iOS app (release) without signing: the target compiles,
    # its plugins and Info.plist keys hold. Signing is the release's job.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: pinned Flutter version
        run: |
          echo "FLUTTER_VERSION=$(sed -n 's/.*"flutter": "\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: packages
        working-directory: app
        run: flutter pub get
      - name: build
        working-directory: app
        run: flutter build ios --release --no-codesign --no-pub

  nav-crate:
    # The guidance engine (app/packages/lunaway_nav/rust): the same gates as
    # the backend's crates, with the backend's licence and advisory policy.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/packages/lunaway_nav/rust
    steps:
      - uses: actions/checkout@v7
      - name: pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/packages/lunaway_nav/rust
          key: ${{ hashFiles('app/packages/lunaway_nav/rust/Cargo.toml') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: format
        run: cargo fmt -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: tests
        run: cargo test --locked
      - name: clippy for the browser (WebAssembly)
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: licences, sources, advisories
        # cargo-deny itself: in `cargo deny --config`, cargo reads the flag.
        run: cargo-deny --log-level error --config ../../../../backend/deny.toml check bans licenses sources advisories

  web:
    # The web app as it is deployed: the guidance crate built to WebAssembly
    # from source with the pinned toolchain (it is not committed: a build
    # made on macOS did not come out byte for byte the same on Linux), then
    # the Flutter web build that serves it. The build fails if either does,
    # and the release must hold the two files the app loads.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: pinned toolchain (rust-toolchain.toml)
        working-directory: app/packages/lunaway_nav/rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/packages/lunaway_nav/rust
          # As in the backend job: the automatic key follows Cargo.lock and
          # the toolchain, not the release profile of Cargo.toml.
          key: ${{ hashFiles('app/packages/lunaway_nav/rust/Cargo.toml') }}
      # wasm-bindgen-cli must match the wasm-bindgen of Cargo.lock.
      - name: wasm-bindgen version of Cargo.lock
        run: |
          echo "WASM_BINDGEN_VERSION=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' app/packages/lunaway_nav/rust/Cargo.lock)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - name: guidance engine for the browser, from source
        run: sh app/packages/lunaway_nav/tool/build_web.sh
      - name: pinned Flutter version
        run: |
          echo "FLUTTER_VERSION=$(sed -n 's/.*"flutter": "\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: packages
        working-directory: app
        run: flutter pub get
      - name: build (the flags of infra/deploy-web.sh)
        working-directory: app
        run: flutter build web --release --wasm --no-pub --base-href /app/ --no-web-resources-cdn
      # What infra/deploy-web.sh does next, without the Brotli copies: a
      # build whose startup files no longer read as the tool expects fails
      # here rather than in a browser.
      - name: fingerprint and service worker (the steps of infra/deploy-web.sh)
        working-directory: app
        run: |
          python3 tool/web/fingerprint.py build/web
          python3 tool/web/service_worker.py build/web
          grep -q 'main.dart.[0-9a-f]\{12\}.wasm' build/web/flutter_bootstrap.*.js
          grep -q 'main.dart.[0-9a-f]\{12\}.js' build/web/flutter_bootstrap.*.js
      # lib/src/load_web.dart loads lunaway_nav/lunaway_nav.js, then
      # lunaway_nav_bg.wasm, and finds the module on `window` only if the
      # glue declares it with `var` (build_web.sh rewrites it).
      - name: the release holds the guidance engine the app loads
        working-directory: app/build/web
        run: |
          test -s lunaway_nav/lunaway_nav_bg.wasm
          head -n 1 lunaway_nav/lunaway_nav.js | grep -q '^var wasm_bindgen = '
          grep -q "'lunaway_nav/lunaway_nav'" ../../packages/lunaway_nav/lib/src/load_web.dart

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: imresamu/postgis:18-3.6
        env:
          POSTGRES_USER: lunaway
          POSTGRES_PASSWORD: lunaway
          POSTGRES_DB: lunaway
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U lunaway -d lunaway"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Queries compile from the committed .sqlx cache; the tests use the service.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://lunaway:lunaway@127.0.0.1:54329/lunaway
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          # The automatic key follows Cargo.lock, not the build profiles of
          # Cargo.toml: after a profile change it kept restoring stale
          # artifacts and never saved the new ones (every run rebuilt all).
          key: ${{ hashFiles('backend/Cargo.toml') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: format
        run: cargo fmt --all -- --check
      - name: structure
        working-directory: .
        run: sh tool/structure_rs.sh
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test database without durability, schema in its template
        # The service is disposable: fsync and full-page writes only slow the
        # thousands of small transactions and CREATE DATABASE calls of the
        # tests. A migrated template1 lets each #[sqlx::test] database start
        # with the schema instead of creating PostGIS and running every
        # migration again (backend/tool/test-template.sh).
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
          sh tool/test-template.sh
      - name: tests
        run: cargo nextest run --locked --workspace --all-targets --profile ci
      - name: licences, sources, advisories
        run: cargo deny --log-level error check bans licenses sources advisories
