name: lunaway
description: "Lunaway, the free and open map of motorhome and van spots."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  logging: ^1.3.0
  riverpod_annotation: ^4.0.7
  slang: ^4.19.2
  slang_flutter: ^4.19.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
