name: lunaway
description: "Lunaway, the free and open map of motorhome and van spots."
publish_to: 'none'
homepage: https://lunaway.net
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.6
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_inappwebview_macos: 1.1.2
  flutter_inappwebview_platform_interface: 1.3.0+1
  flutter_inappwebview_windows: 0.6.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator_apple: ^2.3.14
  geolocator_platform_interface: ^4.4.0
  geolocator_windows: ^0.2.5
  go_router: ^18.0.2
  http: ^1.6.0
  intl: ^0.20.3
  logging: ^1.3.0
  maplibre_gl: 0.27.1
  meta: ^1.19.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_parsing: ^1.1.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  pointer_interceptor: ^0.10.1+3
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  sqlite3: ^3.7.0
  unorm_dart: ^0.3.3
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  gql: ^1.0.1
  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    # The Lunaway mark and lockup (SVG, and PNG at 1x, 2x, 3x), for the design pass.
    - assets/brand/
    # The font licence, registered with the LicenseRegistry for the about page.
    - assets/fonts/OFL.txt
    # The desktop map page and MapLibre GL JS (BSD-3-Clause), loaded by the
    # web view on macOS and Windows; shipped so the map needs no CDN.
    - assets/map/
    # Synthetic photos of the demo mode (tool/demo_photos.py), no real content.
    - assets/demo/
  fonts:
    # Atkinson Hyperlegible Next (SIL OFL 1.1), drawn for low-vision readers:
    # the app is read at arm's length in a van cab, often by older eyes.
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegibleNext-ExtraBold.ttf
          weight: 800
