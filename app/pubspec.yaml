name: lunaway
description: "Lunaway, the free and open map of motorhome and van spots."
publish_to: 'none'
homepage: https://lunaway.net
version: 0.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.6
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_inappwebview_macos: 1.1.2
  flutter_inappwebview_platform_interface: 1.3.0+1
  flutter_inappwebview_windows: 0.6.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator_android: ^5.1.1+1
  geolocator_apple: ^2.3.14
  geolocator_platform_interface: ^4.4.0
  geolocator_windows: ^0.2.5
  go_router: ^18.0.2
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  logging: ^1.3.0
  lunaway_nav:
    path: packages/lunaway_nav
  maplibre_gl: 0.27.1
  meta: ^1.19.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_parsing: ^1.1.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  pointer_interceptor: ^0.10.1+3
  pointycastle: ^4.0.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  sqlite3: ^3.7.0
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.1
  web: ^1.1.1
  zxing2: ^0.2.4

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  # A clock the tests drive, for the retry timers (already in flutter_test).
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  gql: ^1.0.1
  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  # The NFKD of the matching port kept with the tests (test/support/).
  unorm_dart: ^0.3.3
  very_good_analysis: ^11.0.0

hooks:
  user_defines:
    # package:sqlite3 downloads a prebuilt SQLite from GitHub during the
    # native build by default. Every native build (Android, iOS, macOS,
    # Windows) compiles the SQLite amalgamation committed under third_party/
    # instead, with the package's default compile options: nothing fetched
    # at build time, and a source build F-Droid can audit. The web build
    # uses web/sqlite3.wasm. Version and checksums: tool/harness/vendored.txt.
    sqlite3:
      source: source
      path: third_party/sqlite/sqlite3.c

flutter:
  uses-material-design: true
  assets:
    # The Lunaway mark and lockup (SVG, and PNG at 1x, 2x, 3x), for the design pass.
    - assets/brand/
    # The font licences, registered with the LicenseRegistry for the about page.
    - assets/fonts/atkinson-next-lunaway/OFL.txt
    - assets/fonts/fraunces/OFL.txt
    - assets/fonts/phosphor/LICENSE.txt
    # The desktop map page and MapLibre GL JS (BSD-3-Clause), loaded by the
    # web view on macOS and Windows; shipped so the map needs no CDN.
    - assets/map/
    # The map pins per pixel ratio, rendered by tool/map_sprites/.
    - assets/map/pins/2x/
    - assets/map/pins/3x/
    # The "Aube" and "Minuit" basemap styles, generated by tool/map_style/.
    - assets/map/styles/
    # What the map needs offline besides a downloaded pack: the outlines of
    # the packs, the glyphs and the sprites the styles name, vendored by
    # tool/map_offline/.
    - assets/map/offline/
    - assets/map/offline/glyphs/
    - assets/map/offline/glyphs/Noto Sans Regular/
    - assets/map/offline/glyphs/Noto Sans Medium/
    - assets/map/offline/glyphs/Noto Sans Italic/
    - assets/map/offline/sprites/
  fonts:
    # Atkinson Hyperlegible Next (SIL OFL 1.1), drawn for low-vision readers:
    # the app is read at arm's length in a van cab, often by older eyes. A
    # derivative with a plain zero (tool/fonts/), since the original's
    # slashed zero reads as a "Ø" in "30 jours".
    - family: Atkinson
      fonts:
        - asset: assets/fonts/atkinson-next-lunaway/AtkinsonNextLunaway-Regular.ttf
          weight: 400
        - asset: assets/fonts/atkinson-next-lunaway/AtkinsonNextLunaway-Medium.ttf
          weight: 500
        - asset: assets/fonts/atkinson-next-lunaway/AtkinsonNextLunaway-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/atkinson-next-lunaway/AtkinsonNextLunaway-Bold.ttf
          weight: 700
        - asset: assets/fonts/atkinson-next-lunaway/AtkinsonNextLunaway-ExtraBold.ttf
          weight: 800
    # Phosphor icons 2.1 (MIT), regular and fill, vendored by
    # tool/icons/phosphor.py: release builds keep only the glyphs in use.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
    # Fraunces 1.003 (SIL OFL 1.1), the brand's serif, variable on optical
    # size and weight, subset to Latin (tool/fonts/): titles, place names
    # and prominent numbers.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces/Fraunces-Variable.ttf
