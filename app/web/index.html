<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Free and open map of places to stop with a motorhome or a van, usable offline.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FDF1DB">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#061F43">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lunaway">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <title>Lunaway</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading screen: the mark on cream (on a cream disc over navy at night),
       shown until Flutter draws its first frame. -->
  <style>
    html, body { margin: 0; background: #FDF1DB; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: #FDF1DB;
      transition: opacity 0.3s ease-out;
    }
    #splash .disc {
      display: flex; align-items: center; justify-content: center;
      width: 160px; height: 160px; border-radius: 50%;
    }
    #splash img { width: 110px; height: 134px; }
    #splash.done { opacity: 0; pointer-events: none; }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #061F43; }
      #splash .disc { background: #FDF1DB; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="disc"><img src="icons/lunaway-mark.svg" alt=""></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
