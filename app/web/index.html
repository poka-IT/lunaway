<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Free and open map of places to stop with a motorhome or a van, usable offline.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FDF1DB">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#061F43">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lunaway">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <title>Lunaway</title>
  <link rel="manifest" href="manifest.json">

  <!-- The map's library, its stylesheet and the connections to the API and
       the tile host start with the page, while the Flutter engine loads:
       the map then has what it needs the moment the app draws it.
       lunaway_maplibre.js imports the library and publishes it for the
       maplibre_gl plugin (MapLibreJsSource.preloaded). -->
  <link rel="preconnect" href="https://api.lunaway.net" crossorigin>
  <link rel="preconnect" href="https://tiles.lunaway.net" crossorigin>
  <link rel="modulepreload" href="maplibre-gl/maplibre-gl.mjs">
  <link rel="modulepreload" href="maplibre-gl/maplibre-gl-shared.mjs">
  <!-- MapLibre's worker module, fetched with the page rather than when the
       first map starts its worker: served immutable, the worker then finds
       it, and the chunk it shares with the library, in the HTTP cache. -->
  <link rel="modulepreload" href="maplibre-gl/maplibre-gl-worker.mjs">
  <!-- What the first map (premap.js) fetches next, asked for with the
       page: the places' TileJSON, which names the tiles, and both basemap
       styles (the map picks one by the hour or the theme kept), a few kB
       each once compressed. Otherwise each waits on the library or on
       premap.js, one round trip later. -->
  <link rel="preload" href="https://api.lunaway.net/places/tiles.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/map/styles/aube.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/map/styles/minuit.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="maplibre-gl/maplibre-gl.css">

  <!-- Loading screen: the mark on a cream disc over navy, in every theme,
       shown until Flutter draws its first frame. The app turns dark after
       sunset whatever the system says: a cream screen then flashed before a
       dark map, while navy before a light app by day does not dazzle. -->
  <style>
    html, body { margin: 0; background: #061F43; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: #061F43;
      transition: opacity 0.3s ease-out;
    }
    #splash .disc {
      display: flex; align-items: center; justify-content: center;
      width: 160px; height: 160px; border-radius: 50%;
      background: #FDF1DB;
    }
    #splash img { width: 110px; height: 134px; }
    #splash.done { opacity: 0; pointer-events: none; }
    /* The first map (premap.js), over the loading screen and the app until
       the app's own map has drawn the same view. */
    #premap {
      position: fixed; inset: 0; z-index: 20;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease-out;
    }
    #premap.shown { opacity: 1; pointer-events: auto; }
    #premap.done { opacity: 0; pointer-events: none; }
    /* The maps' cursor (lunawayHits.hover in lunaway_maplibre.js): the
       pointing finger over what a click picks, the closed hand while a map
       is dragged. The browser takes the cursor of the element under the
       mouse, and an app's map lies under the app's canvas even where a
       dialog, a sheet or a button covers it: there, the cursor the app
       sets on the body wins. The app marks the body while the mouse is
       over one of its maps as it sees them (web_map_pointer.dart). */
    body .maplibregl-canvas-container.maplibregl-interactive.lw-hit { cursor: pointer; }
    body .maplibregl-canvas-container.maplibregl-interactive.lw-dragging { cursor: grabbing; }
    body:not(.lw-on-map) flt-platform-view .maplibregl-canvas-container.maplibregl-interactive { cursor: inherit; }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="disc"><img src="icons/lunaway-mark.svg" alt=""></div>
  </div>
  <div id="premap" aria-hidden="true"></div>
  <!-- No inline script or event handler attribute in this file: the
       Content-Security-Policy of /app/ (script-src 'self') refuses them.
       splash.js removes the loading screen; lunaway_maplibre.js loads the
       map's library; premap.js draws the first map while the app starts;
       flutter_bootstrap.js (built from web/flutter_bootstrap.js) starts the
       app with our own font host. -->
  <script src="splash.js"></script>
  <script src="lunaway_maplibre.js" async></script>
  <script src="premap.js" async></script>
  <script src="sw_register.js" async></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
