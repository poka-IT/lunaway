<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The page runs only the scripts shipped beside it and talks only to the
       basemap host and the API (the points of interest's tiles); MapLibre's
       workers start from blob URLs. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob: https://tiles.lunaway.net; connect-src https://tiles.lunaway.net https://api.lunaway.net; worker-src blob:; child-src blob:; font-src 'self' file:; base-uri 'none'; form-action 'none'">
  <title>Lunaway map</title>
  <link rel="stylesheet" href="maplibre-gl.css">
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #f3ead9; }
    @media (prefers-color-scheme: dark) { body { background: #0a1c36; } }
    .lunaway-position {
      width: 16px; height: 16px; border-radius: 50%;
      background: #409fa7; border: 3px solid #fdf1db;
      box-shadow: 0 0 0 6px rgba(64, 159, 167, 0.25);
    }
  </style>
  <script src="maplibre-gl.js"></script>
  <script src="lunaway_map.js"></script>
  <script src="route_motion.js"></script>
  <script src="route_marks.js"></script>
</head>
<body>
  <div id="map"></div>
</body>
</html>
