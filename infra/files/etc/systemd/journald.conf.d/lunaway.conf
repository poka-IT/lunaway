# Persistent journal, bounded in size and in age: enough to investigate an
# incident, not an archive of who connected when.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=1G
SystemKeepFree=2G
SystemMaxFileSize=64M
# A file is removed once its last entry is a month old: a new file every
# week bounds an entry's life to six weeks at most (a week in the open
# file, a month, then up to a week until journald next clears), where
# files closed by size alone kept the first entries of a quiet month up to
# two months.
MaxFileSec=1week
MaxRetentionSec=1month
ForwardToSyslog=no
