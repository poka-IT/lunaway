# Lunaway SSH policy, written at first boot by cloud-init and kept by
# infra/server/harden.sh. sshd keeps the first value it reads for a keyword and
# reads this directory in lexical order, so this file outranks the cloud-init
# drop-in (50-cloud-init.conf) and anything sorted after it.

# One admin account, public keys only.
PermitRootLogin no
AllowUsers ops
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
HostbasedAuthentication no
IgnoreRhosts yes
GSSAPIAuthentication no
PermitUserEnvironment no

# Brute force and half-open connections. OpenSSH 10 also applies
# PerSourcePenalties by default: a source that fails authentication waits.
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 10:30:60
MaxSessions 4
ClientAliveInterval 300
ClientAliveCountMax 2

# Nothing tunnels through this host. A database session goes through
# `ssh lunaway sudo -u postgres psql`, which needs no forwarding.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no

# VERBOSE logs the fingerprint of the key behind each login.
LogLevel VERBOSE
UseDNS no
