#!/usr/sbin/nft -f
# Host firewall of a Lunaway server, written at first boot by cloud-init and
# kept by infra/server/harden.sh. The Hetzner Cloud Firewall filters the
# public interface first; this ruleset is the second wall there, and the only
# one on the private network, which Hetzner firewalls do not filter.
#
# This base is common to both roles and opens SSH only. The role's openings
# come from /etc/nftables.d/lunaway-role.nft (infra/files/roles/<role>/),
# included at the end.
#
# Only this table is replaced on reload, so the table fail2ban maintains
# (inet f2b-table) keeps its bans when nftables.service restarts.

table inet lunaway
delete table inet lunaway

table inet lunaway {
	# Sources opening SSH connections too fast, forgotten after two minutes.
	set ssh_flood_v4 {
		type ipv4_addr
		flags dynamic, timeout
		timeout 2m
	}
	set ssh_flood_v6 {
		type ipv6_addr
		flags dynamic, timeout
		timeout 2m
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		# Loopback addresses can only come from the loopback interface.
		ip daddr 127.0.0.0/8 drop
		ip6 daddr ::1 drop

		# IPv6 does not work without neighbour discovery and path MTU discovery.
		meta l4proto ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		meta l4proto icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
		meta l4proto ipv6-icmp icmpv6 type echo-request limit rate 10/second burst 20 packets accept
		meta l4proto icmp icmp type echo-request limit rate 10/second burst 20 packets accept

		# DHCPv4 replies: Hetzner hands the IPv4 address out over DHCP.
		udp sport 67 udp dport 68 accept

		# The ops server (LUNAWAY_OPS_PRIVATE_IP, infra/lib.sh) opens one SSH
		# connection per status check, and its hourly checks start with the
		# five-minute ones: 15 within about 20 s, so the limit below dropped the
		# last two every hour (2026-10-06, 20:11 and 21:11). It is already
		# exempt from fail2ban for the same reason; its keys stay forced to
		# one read-only command each. The exemption skips only the rate
		# limit, and only on the private interface (enp7s0 on both servers,
		# 2026-10-07): a forged source on the public one meets the limit.
		iifname "enp7s0" ip saddr 10.42.0.3 tcp dport 22 accept
		tcp dport 22 ct state new add @ssh_flood_v4 { ip saddr limit rate over 10/minute burst 10 packets } drop
		tcp dport 22 ct state new add @ssh_flood_v6 { ip6 saddr limit rate over 10/minute burst 10 packets } drop
		tcp dport 22 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

include "/etc/nftables.d/*.nft"
