# Client authentication of the Lunaway cluster, installed by
# infra/server/postgres.sh. PostgreSQL listens on localhost only.
#
# TYPE  DATABASE  USER                        ADDRESS        METHOD

# Administration and the nightly dump: the postgres system user, over the
# unix socket, no password.
local   all       postgres                                   peer

# The API, the imports and conflation, and the migrations: password over loopback
# TCP, SCRAM only.
host    lunaway   lunaway_app,lunaway_ingest,lunaway_owner   127.0.0.1/32   scram-sha-256
host    lunaway   lunaway_app,lunaway_ingest,lunaway_owner   ::1/128        scram-sha-256
