# Gatus on the ops server: the public status page of Lunaway and the checks
# behind it, run from outside the backend (another server, another
# datacenter). infra/server/ops-status.sh renders this file into
# /etc/gatus/config.yaml (root:gatus, 0640), filling in the markers between
# double underscores. Gatus answers on loopback only; Caddy serves the page.
#
# Two groups:
#   public    what a user meets: the API, its certificate, the web app, the
#             basemap, the points of interest, routing, the road events;
#             checked over HTTPS like any client
#   backend   the backend's own facts, read over the private network from
#             its health probe (lunaway-health, a forced SSH command of the
#             lunaway-pull account): PostgreSQL, the data volume, the nightly
#             dump, the conflation worker, the photo backup, the basemap's
#             build and offline packs, the fuel prices, the routing graph,
#             the OpenStreetMap imports of France and Europe, the regional
#             packs of places, the points layer's publication, the speed
#             camera lists and the build of their zones. Gatus does not
#             check SSH host keys. A host posing as the backend gets nothing
#             it can reuse (the key's signature is bound to that one
#             session); it could only answer a false green, and it would
#             have to sit on the private network.
#
# Nothing here alerts by itself: the maintainer's Mac reads
# /api/v1/endpoints/statuses every night and opens a GitHub issue when a
# check fails (infra/ops/mac/).

web:
  address: 127.0.0.1
  port: 8080

storage:
  type: sqlite
  path: /var/lib/gatus/data.db

ui:
  title: Lunaway status
  header: Lunaway
  description: Status of the Lunaway services
  link: https://lunaway.net

endpoints:
  - name: API
    group: public
    url: "https://__API_HOST__/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == ok"
      - "[RESPONSE_TIME] < 3000"

  - name: GraphQL
    group: public
    url: "https://__API_HOST__/graphql"
    method: POST
    graphql: true
    headers:
      Content-Type: application/json
    body: "{ apiVersion }"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "has([BODY].data.apiVersion) == true"

  # Let's Encrypt certificates last 90 days and Caddy renews them 30 days
  # before the end: under 14 days left means renewals have been failing for
  # two weeks.
  - name: API certificate
    group: public
    url: "https://__API_HOST__/health"
    interval: 1h
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 336h"

  # Off until the web app is served (LUNAWAY_WEB_URL in the private settings).
  - name: Web app
    group: public
    enabled: __WEB_ENABLED__
    url: "__WEB_URL__"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  # The basemap (docs/deploy.md, "Basemap"): the TileJSON names the current
  # build in its tile URLs, and a z14 tile over Paris comes back through
  # Caddy and pmtiles. __TILES_URL__ is the sslip.io name's /tiles until DNS
  # exists, then https://tiles.lunaway.net (LUNAWAY_TILES_URL).
  - name: Basemap TileJSON
    group: public
    url: "__TILES_URL__/planet.json"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].tilejson == 3.0.0"
      - "[BODY].tiles[0] == pat(__TILES_URL__/planet-*.mvt)"

  - name: Basemap tile
    group: public
    url: "__TILES_URL__/planet/14/8299/5636.mvt"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY]) > 1000"
      - "[RESPONSE_TIME] < 2000"

  # The offline packs' manifest (docs/deploy.md, "Offline packs"), as the
  # app reads it: version 1, at least one pack. Its age is checked on the
  # backend (Offline packs).
  - name: Offline packs manifest
    group: public
    url: "__TILES_URL__/packs/manifest.json"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].version == 1"
      - "len([BODY].packs) > 0"

  # The points of interest (docs/deploy.md, "Points of interest"): the
  # TileJSON names tiles on the API host, and a tile over Annecy comes back
  # from PostGIS with points in it. The tile asks for version 1, an old one:
  # the API answers any old version with the current data (5 minutes of
  # cache), so the check keeps working as the layer's version moves.
  - name: POI TileJSON
    group: public
    url: "https://__API_HOST__/poi/tiles.json"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].tilejson == 3.0.0"
      - "[BODY].tiles[0] == pat(https://__API_HOST__/poi/*/{z}/{x}/{y}.mvt)"

  - name: POI tile
    group: public
    url: "https://__API_HOST__/poi/1/13/4235/2917.mvt"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY]) > 1000"
      - "[RESPONSE_TIME] < 3000"

  # The regional packs of places (docs/region-packs.md) as the app reads
  # them: the sync regions in their fixed order, the first one (Auvergne-
  # Rhone-Alpes, with places every day) naming a pack under the API host.
  # How long a region waits for its pack is checked on the backend
  # (Regional packs of places).
  - name: Regional packs manifest
    group: public
    url: "https://__API_HOST__/graphql"
    method: POST
    graphql: true
    headers:
      Content-Type: application/json
    body: "{ regions { code pack { url bytes } } }"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].data.regions) > 30"
      - "[BODY].data.regions[0].code == FR-ARA"
      - "[BODY].data.regions[0].pack.url == pat(https://__API_HOST__/packs/places/FR-ARA-*.sqlite.gz)"
      - "[BODY].data.regions[0].pack.bytes > 10000"

  # Motorhome routing (docs/deploy.md, "Routing"): the API has an active
  # graph and reaches the engine.
  - name: Routing
    group: public
    url: "https://__API_HOST__/graphql"
    method: POST
    graphql: true
    headers:
      Content-Type: application/json
    body: "{ routing { available graph { builtAt } } }"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].data.routing.available == true"

  # A witness route through the whole check: Rue Maurice Utrillo in
  # Limoges, where a 3.3 m motorhome must go round the 2.7 m railway bridge
  # (infra/routing/test-routes.json): under the bridge the route is shorter
  # than 500 m, round it longer than 1 km (route_e2e.rs in lunaway-api).
  # Four routes an hour stay far inside the quota of 30 every ten minutes
  # per client.
  - name: Witness route
    group: public
    url: "https://__API_HOST__/graphql"
    method: POST
    graphql: true
    headers:
      Content-Type: application/json
    body: "{ route(input: {origin: {lat: 45.84719, lon: 1.28476}, destination: {lat: 45.8451, lon: 1.28637}, vehicle: {kind: OVERCAB, heightM: 3.3, widthM: 2.3, lengthM: 7.4, weightT: 3.5}}) { status routes { distanceM } } }"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].data.route.status == OK"
      - "[BODY].data.route.routes[0].distanceM > 1000"
      - "[RESPONSE_TIME] < 15000"

  # Road events (docs/deploy.md, "Road events"). The sources come in a fixed
  # order, the DIR first and DiaLog second. ageSeconds counts from the last
  # read that succeeded: the DIR is read every 3 minutes, DiaLog every 15,
  # so 15 and 45 minutes mean the poller or the feed has failed several runs
  # in a row. The feed itself answers a page with a cursor.
  - name: Road events (DIR feed read)
    group: public
    url: "https://__API_HOST__/graphql"
    method: POST
    graphql: true
    headers:
      Content-Type: application/json
    body: "{ roadEventSources { id ageSeconds } }"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].data.roadEventSources[0].id == dir"
      - "[BODY].data.roadEventSources[0].ageSeconds < 900"

  - name: Road events (DiaLog read)
    group: public
    url: "https://__API_HOST__/graphql"
    method: POST
    graphql: true
    headers:
      Content-Type: application/json
    body: "{ roadEventSources { id ageSeconds } }"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].data.roadEventSources[1].id == dialog"
      - "[BODY].data.roadEventSources[1].ageSeconds < 2700"

  - name: Road events feed
    group: public
    url: "https://__API_HOST__/graphql"
    method: POST
    graphql: true
    headers:
      Content-Type: application/json
    body: "{ roadEvents(first: 1) { cursor asOf } }"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "has([BODY].data.roadEvents.cursor) == true"
      - "[RESPONSE_TIME] < 3000"

  - name: PostgreSQL
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    # The forced command answers whatever is asked; Gatus needs a command.
    body: '{"command": "health"}'
    interval: 5m
    ui: &private
      hide-hostname: true
      hide-url: true
      hide-port: true
      hide-errors: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 0"
      - "[BODY].postgresql == ok"

  # Grow the volume before 80% (docs/deploy.md, "Sizing").
  - name: Data volume
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 10m
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].data_volume.mounted == true"
      - "[BODY].data_volume.used_percent < 80"
      - "[BODY].root_disk.used_percent < 85"

  # Succeeded less than 26 hours ago, and no failure recorded since.
  - name: Nightly dump
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 15m
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].dump.ok == true"

  # The conflation worker (lunaway-conflate-worker): the unit runs, its queues
  # were measured in the last 5 minutes, and nothing waited there 15 minutes.
  # Without it, nothing the community writes reaches the map.
  - name: Conflation worker
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 5m
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].worker.ok == true"

  # The encrypted copy of the photos was brought up to date in the last 26
  # hours (lunaway-media-offsite, nightly).
  - name: Photo backup
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 15m
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].media_backup.ok == true"

  # The encrypted copy of the account deletion journal was written in the
  # last 3 hours (lunaway-deletions-offsite, hourly). Without it, a restore
  # after the loss of the data volume brings deleted accounts back.
  - name: Account deletion journal backup
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 15m
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].deletions_backup.ok == true"

  # The monthly refresh installs a build dated a day or two earlier; a build
  # older than 35 days means the last refresh failed.
  - name: Basemap build
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 1h
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].tiles.mounted == true"
      - "[BODY].tiles.age_days >= 0"
      - "[BODY].tiles.age_days < 35"

  # The offline packs follow each planet refresh within minutes: the
  # manifest names one pack per outline, built from the planet served (or a
  # planet switched less than a day ago), less than 35 days old.
  - name: Offline packs
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 1h
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].packs.ok == true"
      - "[BODY].packs.age_days < 35"

  # The fuel prices (lunaway-ingest-fuel, every 15 minutes) were stored less
  # than 2 hours ago: the feed or its import has failed for 8 runs in a row
  # otherwise, and the prices and shortages on the map are going stale.
  - name: Fuel prices
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 15m
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].fuel.ok == true"

  # The OpenStreetMap places: France read less than 30 hours ago (daily,
  # 03:00 UTC), every other country less than 8 days ago (one group of
  # countries a day, Monday to Saturday), and no import, packs or speed
  # camera unit failed: an import whose truncation guard refuses a country
  # stores the rest and fails, so the country keeps its places and this
  # check turns red.
  - name: Places imports (France and Europe)
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 15m
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].imports.ok == true"
      - "[BODY].imports.failed_units == 0"

  # The regional first-sync packs of places (docs/region-packs.md): no sync
  # region waited more than two days for a pack holding its changes
  # (lunaway-packs runs after each import of places and daily at 06:30).
  - name: Regional packs of places
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 1h
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].region_packs.ok == true"
      - "[BODY].region_packs.stale == 0"

  # The tiles of the points of interest get a new version at most every 6
  # hours; a change that has waited 8 hours means the worker's publication
  # is stuck, and the devices keep tiles without it.
  - name: Points layer publication
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 15m
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].poi_layer.ok == true"

  # The five official speed camera lists (docs/data-sources.md, "Speed
  # cameras") were each read less than 30 hours ago (daily, 05:30 UTC): the
  # date the app cites with the French list comes from that read.
  - name: Speed camera lists
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 1h
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].cameras.ok == true"

  # The danger zones and camera points were built less than 30 hours ago
  # (lunaway-enforcement, daily after the lists).
  - name: Danger zones build
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 1h
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].enforcement.ok == true"

  # The engine's unit runs and serves a graph built less than 10 days ago:
  # the build is weekly and the refresh daily, so an older graph means a
  # failed build or refresh.
  - name: Routing graph
    group: backend
    url: "ssh://__BACKEND_PRIVATE_IP__:22"
    ssh:
      username: lunaway-pull
      private-key: |
__PROBE_KEY__
    body: '{"command": "health"}'
    interval: 15m
    ui: *private
    conditions:
      - "[CONNECTED] == true"
      - "[BODY].routing.ok == true"
