# Morocco starts once Europe serves (its ExecStartPost=, lunaway-photon-ready),
# whenever both start together: at boot, or on a restart of both. Their
# embedded OpenSearch instances take their HTTP ports from 9201 by asking
# which one answers, and two starting together took the same one
# (BindException, 2026-10-10 and 2026-10-11). Ordering only: Morocco still
# starts when Europe fails or has no database.
[Unit]
After=photon@europe.service
