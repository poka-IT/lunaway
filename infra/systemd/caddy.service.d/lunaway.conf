# Sandbox added to the caddy.service shipped by the Caddy package, which only
# sets ProtectSystem=full and PrivateTmp. Installed by infra/server/caddy.sh.
[Unit]
RequiresMountsFor=/srv/data

[Service]
# The admin API listens on a unix socket in this directory (see the
# Caddyfile), out of reach of the other local users, the API included.
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
ProtectSystem=strict
ReadWritePaths=/var/lib/caddy /var/log/caddy
ProtectHome=yes
PrivateDevices=yes
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
PrivateIPC=yes
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_NET_ADMIN
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictRealtime=yes
RestrictNamespaces=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
SystemCallErrorNumber=EPERM
UMask=0027
