# Installed by infra/server/postgres.sh beside lunaway.conf. Resource
# settings only, one `Memory...=` per line: postgres.sh gives them to the
# running cluster as well (systemctl set-property --runtime), so it never
# restarts PostgreSQL for this file.
[Service]
# No swap: the shared buffers (shared_buffers, an eighth of the memory) are
# shared memory the kernel may otherwise swap like any other, and a query
# would then wait on a page the database believes is in memory. The
# server's swap is compressed memory (zram); what stays swappable is the
# memory of the imports, the crawler and the other jobs that wait on
# nobody (docs/deploy.md, "Memory").
MemorySwapMax=0
