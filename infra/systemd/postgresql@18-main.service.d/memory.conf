# Installed by infra/server/postgres.sh beside lunaway.conf, and applied
# without a restart of PostgreSQL: a daemon-reload carries OOMPolicy, and
# postgres.sh gives the running cluster its MemorySwapMax, MemoryHigh,
# MemoryLow and MemoryMin lines (systemctl set-property --runtime), one per
# line, `Key=value`. A MemoryMax line would be read only at the next start.
[Service]
# No swap: the shared buffers (shared_buffers, an eighth of the memory) are
# shared memory the kernel may otherwise swap like any other, and a query
# would then wait on a page the database believes is in memory. The
# server's swap is compressed memory (zram); what stays swappable is the
# memory of the imports, the crawler and the other jobs that wait on
# nobody (docs/deploy.md, "Memory").
MemorySwapMax=0
# A process of the cluster the kernel stops for want of memory is the
# postmaster's to replace (it restarts its children after a crash
# recovery). systemd's default, stop, would stop the whole cluster, and
# Debian's postgresql@.service does not restart it (Restart=no).
OOMPolicy=continue
