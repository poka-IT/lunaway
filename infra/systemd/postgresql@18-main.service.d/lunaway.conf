# Installed by infra/server/postgres.sh over Debian's postgresql@.service,
# which runs pg_ctlcluster as root with no sandbox. The cluster's data
# directory is writable through data-directory.conf, which postgres.sh
# writes beside this file; the cluster lives on the root disk and needs no
# volume.
[Service]
# pg_ctlcluster works as the cluster owner as well as root; as the owner it
# needs no privilege at all.
User=postgres
Group=postgres
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0077

# Writable: its socket and pid directory, its log, and the data directory
# (data-directory.conf). The rest of the tree is read-only, homes are
# hidden.
ProtectSystem=strict
ReadWritePaths=/run/postgresql /var/log/postgresql
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectProc=invisible

ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
# jit is off (conf.d/90-lunaway.conf), so no code is generated at run time.
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
SystemCallErrorNumber=EPERM

# Clients reach PostgreSQL over the unix socket or loopback only.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
IPAddressDeny=any
IPAddressAllow=localhost
