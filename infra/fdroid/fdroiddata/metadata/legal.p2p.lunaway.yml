AntiFeatures:
  TetheredNet:
    en-US: Places, reviews and routes come from the project's own server, api.lunaway.net
      (free software, AGPL); its address is set when the app is built and cannot be
      changed in the app.
    fr-FR: Les lieux, les avis et les itinéraires viennent du serveur du projet, api.lunaway.net
      (logiciel libre, AGPL) ; son adresse est fixée à la construction de l'app et
      ne se change pas dans l'app.
Categories:
  - Navigation
License: AGPL-3.0-or-later
AuthorName: Lunaway
AuthorEmail: contact@lunaway.net
WebSite: https://lunaway.net
SourceCode: https://github.com/poka-IT/lunaway
IssueTracker: https://github.com/poka-IT/lunaway/issues

AutoName: Lunaway

RepoType: git
Repo: https://github.com/poka-IT/lunaway.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-java-alternatives -a
    output: build/app/outputs/flutter-apk/app-fdroid-release.apk
    srclibs:
      - flutter@3.47.6
    rm:
      - app/ios
      - app/macos
      - app/windows
      - app/web/sqlite3.wasm
      - app/web/drift_worker.js
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - app/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid
    ndk: 28.2.13676358

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.1.0
CurrentVersionCode: 1
