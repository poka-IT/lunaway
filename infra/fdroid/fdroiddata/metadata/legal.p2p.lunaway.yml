AntiFeatures:
  TetheredNet:
    en-US: Places, reviews, routes, fuel prices and the map come from the project's own servers,
      api.lunaway.net and tiles.lunaway.net (free software, AGPL); their addresses are set
      when the app is built and cannot be changed in the app.
    fr-FR: Les lieux, les avis, les itinéraires, les prix des carburants et la carte viennent des
      serveurs du projet, api.lunaway.net et tiles.lunaway.net (logiciel libre, AGPL) ;
      leurs adresses sont fixées à la construction de l'app et ne se changent pas dans
      l'app.
Categories:
  - Navigation
License: AGPL-3.0-or-later
AuthorName: Lunaway
AuthorEmail: contact@lunaway.net
WebSite: https://lunaway.net
SourceCode: https://github.com/poka-IT/lunaway
IssueTracker: https://github.com/poka-IT/lunaway/issues

AutoName: Lunaway

RepoType: git
Repo: https://github.com/poka-IT/lunaway.git

Builds:
  - versionName: 0.1.0
    versionCode: 2
    commit: v0.1.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-java-alternatives -a
    output: build/app/outputs/flutter-apk/app-fdroid-release.apk
    srclibs:
      - flutter@3.47.6
    rm:
      - app/ios
      - app/macos
      - app/windows
      - app/web/sqlite3.wasm
      - app/web/drift_worker.js
      - app/web/lunaway_nav
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - app/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid
    ndk: 28.2.13676358

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.1.0
CurrentVersionCode: 2
